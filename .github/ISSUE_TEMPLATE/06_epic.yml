name: "👑 Epic"
description: A large body of work that can be broken down into smaller issues
title: "[Epic] "
labels: ["type: epic"]
body:
  - type: markdown
    attributes:
      value: |
        Epics are tracking issues for large bodies of work. They coordinate child issues and track overall progress.

  - type: textarea
    id: objective
    attributes:
      label: Objective & Preamble
      description: What is the high-level goal of this epic? What problem space does it address?
      placeholder: Provide a clear, high-level summary of the epic's scope.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What are the high-level milestones or deliverables?
      value: |
        - [ ] Milestone 1
        - [ ] Milestone 2
    validations:
      required: true

  - type: textarea
    id: implementation-brief
    attributes:
      label: Implementation Brief
      description: Architectural overview, child issue breakdown, or phased rollout plan.
      placeholder: Outline the execution plan and child issue structure.

  - type: textarea
    id: qa-checklist
    attributes:
      label: QA Checklist
      description: End-to-end verification steps for the completed epic.
      value: |
        - [ ] All child issues completed
        - [ ] Integration testing passed
